name: richfield_connect
description: "Richfield Graduate Network — professional networking app prototype for the 2026 Richfield Hackathon."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10+1
  supabase_flutter: ^2.0.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.0.0
  # Device gallery access. Without this there is literally no way for the
  # app to read a file off the phone — the composer's "Add PNG image"
  # button previously just flipped a bool because no picker existed.
  image_picker: ^1.1.2
  # Opens a profile's external links (GitHub / LinkedIn / website) in the
  # system browser. _socialLinksRow() used to render them as plain Text.
  url_launcher: ^6.3.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - richfield-spinner-animated.svg
