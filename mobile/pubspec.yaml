name: richfield_connect
description: "Richfield Graduate Network — professional networking app prototype for the 2026 Richfield Hackathon."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10+1
  supabase_flutter: ^2.0.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.0.0
  # Device gallery access. Without this there is literally no way for the
  # app to read a file off the phone — the composer's "Add PNG image"
  # button previously just flipped a bool because no picker existed.
  image_picker: ^1.1.2
  # Opens a profile's external links (GitHub / LinkedIn / website) in the
  # system browser. _socialLinksRow() used to render them as plain Text.
  url_launcher: ^6.3.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  # AiService's HTTP client for the /ai/ Flask microservice.
  http: ^1.6.0
  file_selector: ^1.1.0
  video_compress: ^3.1.4
  video_player: ^2.14.0
  app_links: ^7.2.1
  # QR Connect: renders richfield://member/<uid> on the Portfolio so another
  # member can scan it with their camera (services/member_link.dart).
  pretty_qr_code: ^3.6.0
  # Native OS share sheet for the feed's Share button (main.dart's
  # _sharePost) — WhatsApp, Messages, X, email, whatever else is installed.
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - richfield-spinner-animated.svg

# App icon: Keshav's Richfield crest SVG (mobile/richfield-spinner-animated.svg,
# already the app's own loading-spinner asset), rasterized to PNG and run
# through flutter_launcher_icons in place of Flutter's default launcher icon.
# `dart run flutter_launcher_icons` regenerates
# android/app/src/main/res/{mipmap,drawable}-*/ic_launcher*. iOS is off -
# there's no ios/ platform directory in this project (Android only).
flutter_launcher_icons:
  android: true
  ios: false # no ios/ platform directory in this project - Android only
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
