<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="96" height="96">
  <title>Richfield Loading Spinner</title>
  <defs>
    <linearGradient id="rf-badge-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A4DA2"/>
      <stop offset="100%" stop-color="#063877"/>
    </linearGradient>
    <linearGradient id="rf-ring-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF4B3E"/>
      <stop offset="100%" stop-color="#0A4DA2"/>
    </linearGradient>
  </defs>

  <style>
    .rf-ring{
      transform-origin: 50px 50px;
      animation: rf-rotate 1.1s linear infinite;
    }
    @keyframes rf-rotate{ to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce){
      .rf-ring{ animation: none; }
    }
  </style>

  <!-- static badge + crest -->
  <circle cx="50" cy="50" r="33" fill="url(#rf-badge-grad)"/>
  <g transform="translate(50,50) scale(0.5) translate(-50,-59)">
    <path d="M20,16 Q50,6 80,16 L80,60 Q80,90 50,112 Q20,90 20,60 Z" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    <path d="M33,52 L38,44 L43,47 L47,38 L52,42 L58,32 L64,44 L64,52 Z" fill="#FF4B3E"/>
    <rect x="33" y="53" width="31" height="6" fill="#fff"/>
    <path d="M39,62 L58,62 L53,88 L44,88 Z" fill="#fff"/>
  </g>

  <!-- rotating ring -->
  <circle class="rf-ring" cx="50" cy="50" r="44" pathLength="100" stroke-dasharray="62 38"
          stroke-linecap="round" fill="none" stroke="url(#rf-ring-grad)" stroke-width="7"/>
</svg>
